<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肢體語言總覽</title>
<style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#203c34;background:#eef1e9;line-height:1.6}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1500px;margin:auto;padding:24px}h1{font-size:30px;margin:0 0 6px}h2{font-size:19px;margin:0}p{margin:8px 0}.sub{color:#596e64}.toolbar{position:sticky;top:0;z-index:2;background:#f9fbf5ed;border-block:1px solid #d6dfd0;padding:14px 24px;backdrop-filter:blur(12px)}.tools{max-width:1452px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit;border:1px solid #aebeb0;border-radius:7px;padding:8px 12px;color:inherit;background:white}button{cursor:pointer}button:hover{background:#e7eee2}button.primary{background:#285c49;color:white;border-color:#285c49}input{min-width:220px}a{color:#28694d}.count{margin-left:auto;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:20px}.card{background:#fcfdf8;border:1px solid #dbe3d6;border-radius:14px;overflow:hidden}.caption{padding:16px}.hint{font-size:14px;min-height:44px;color:#576c61}.pose{position:relative;aspect-ratio:1;overflow:hidden;background:#25312f;border-block:1px solid #dbe3d6}.pose img{display:block;position:absolute;top:0;left:0;width:400%;max-width:none;height:auto;transform:translateX(-75%)}body[data-view="strip"] .pose{aspect-ratio:4}body[data-view="strip"] .pose img{width:100%;transform:none!important}.steps{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:12px}.step{padding:5px 9px;min-width:34px}.step[aria-pressed="true"]{background:#d9e8d3;border-color:#477c58}.frame{margin-left:auto;font-size:13px;color:#64776a}.strip-labels{display:none;grid-template-columns:repeat(4,1fr);text-align:center;font-size:12px;padding:5px;background:#edf2e8}body[data-view="strip"] .strip-labels{display:grid}.grid .card[hidden]{display:none}.empty{padding:35px;text-align:center}.reuse{border-top:1px solid #d5dfcf;margin-top:30px;padding-top:20px}.reuse ul{columns:3;padding-left:23px}.pose.error::after{content:"素材載入失敗";color:white;position:absolute;inset:40% 0;text-align:center}body[data-bg="white"] .pose{background:white}body[data-bg="checker"] .pose{background:conic-gradient(#dae0d5 25%,#f9faf5 0 50%,#dae0d5 0 75%,#f9faf5 0) 0 0/24px 24px}footer{font-size:13px;color:#65776c;padding-top:0}@media(max-width:650px){header,main,footer{padding:18px}.toolbar{padding:10px 18px}.count{margin-left:0;width:100%}.reuse ul{columns:1}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){.toolbar{backdrop-filter:none}}
</style></head><body data-view="portrait" data-bg="dark">
<header><h1>肢體語言總覽</h1><p id="intro"></p><p class="sub">先看最終姿勢，或切換四格定格對照。每組由左至右為 0 → 1 → 2 → 3；播放一次後停在第 3 格。</p><a href="report.html">開啟完整表情與肢體預覽 →</a></header>
<nav class="toolbar" aria-label="總覽控制"><div class="tools"><label>搜尋姿勢 <input id="search" type="search" placeholder="編號、表情或肢體描述"></label><button id="portrait" class="primary">最終姿勢</button><button id="strip">四格定格對照</button><button id="play">全部播放一次</button><button id="pause">全部暫停</button><label>背景 <select id="background"><option value="dark">深色</option><option value="white">白底</option><option value="checker">透明格</option></select></label><span id="count" class="count" role="status"></span></div></nav>
<main><div id="cards" class="grid"></div><p id="empty" class="empty" hidden>沒有符合的姿勢。</p><section class="reuse"><h2>沿用預設站姿</h2><p class="sub">以下表情保留 A 的固定站姿，使用各自的眼睛與嘴型變化。</p><ul id="reuse"></ul></section></main>
<footer><p id="verification"></p></footer>
<script id="data" type="application/json">__BODY_DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),cards=[];
document.title=D.character+'｜肢體語言總覽';$('intro').textContent=D.character+' · '+D.motions.length+' 組新增肢體動作 · '+D.reuse.length+' 項沿用預設站姿';
$('verification').textContent='四格 PNG 與完整報告共用同一批素材。本頁列出已接受的動作。'+(D.art_complete?'本批素材已完成。':'本批仍有未完成素材。')+(D.engine_verification==='passed'?'完整 RPG Maker MZ 實機測試已通過。':'完整 RPG Maker MZ 實機測試尚未執行。');
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function setFrame(c,n){c.frame=n;c.image.style.transform='translateX('+(-25*n)+'%)';c.readout.textContent='第 '+n+' 格';c.buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n)))}
function setView(view){document.body.dataset.view=view;$('portrait').className=view==='portrait'?'primary':'';$('strip').className=view==='strip'?'primary':''}
function play(c){setView('portrait');c.playing=true;c.started=performance.now();setFrame(c,0)}
function filter(){const q=$('search').value.trim().toLocaleLowerCase();for(const c of cards){c.article.hidden=q!==''&&!c.search.includes(q);if(c.article.hidden)c.playing=false}const visible=cards.filter(c=>!c.article.hidden).length;$('count').textContent=visible+' / '+cards.length+' 組';$('empty').hidden=visible!==0}
for(const row of D.motions){const article=element('article',undefined,'card');article.id='motion-'+row.no;article.dataset.no=row.no;const top=element('div',undefined,'caption');top.append(element('h2',String(row.no).padStart(2,'0')+' · '+row.name),element('p',row.hint,'hint'));article.append(top);const pose=element('div',undefined,'pose'),im=element('img');im.alt=row.name+'四格肢體動作';im.loading='lazy';im.decoding='async';im.src=row.image;im.onerror=()=>{pose.classList.add('error');pose.setAttribute('role','alert')};pose.append(im);article.append(pose);const labels=element('div',undefined,'strip-labels');for(const label of ['0 休止','1 起勢','2 過渡','3 定格'])labels.append(element('span',label));article.append(labels);const bottom=element('div',undefined,'caption'),steps=element('div',undefined,'steps'),readout=element('span',undefined,'frame'),c={row,article,image:im,readout,buttons:[],frame:3,playing:false,search:(String(row.no).padStart(2,'0')+' '+row.no+' '+row.name+' '+row.hint).toLocaleLowerCase()};const start=element('button','播放一次');start.setAttribute('aria-label','播放 '+row.no+' '+row.name);start.onclick=()=>play(c);steps.append(start);for(let n=0;n<4;n++){const b=element('button',String(n),'step');b.setAttribute('aria-label',row.no+' '+row.name+' 第 '+n+' 格');b.onclick=()=>{c.playing=false;setView('portrait');setFrame(c,n)};c.buttons.push(b);steps.append(b)}steps.append(readout);bottom.append(steps);const download=element('a','下載四格 PNG');download.href=row.image;download.download='';const linkRow=element('p');linkRow.append(download);bottom.append(linkRow);article.append(bottom);cards.push(c);setFrame(c,3);$('cards').append(article)}
for(const row of D.reuse)$('reuse').append(element('li',String(row.no).padStart(2,'0')+' · '+row.name));
$('search').oninput=filter;$('portrait').onclick=()=>{setView('portrait');for(const c of cards){c.playing=false;setFrame(c,3)}};$('strip').onclick=()=>{for(const c of cards)c.playing=false;setView('strip')};$('play').onclick=()=>{for(const c of cards)if(!c.article.hidden)play(c)};$('pause').onclick=()=>{for(const c of cards)c.playing=false};$('background').onchange=()=>document.body.dataset.bg=$('background').value;
function animate(now){for(const c of cards)if(c.playing){const n=Math.floor((now-c.started)/(1000*c.row.frameWait/60));setFrame(c,Math.min(3,n));if(n>=4)c.playing=false}requestAnimationFrame(animate)}filter();requestAnimationFrame(animate);
</script></body></html>
